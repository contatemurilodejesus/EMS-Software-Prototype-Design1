# nginx do frontend (docker/frontend.Dockerfile).
# O navegador consome APENAS esta origem: /api e proxy para o backend oficial
# (nada de dados operacionais por outro caminho - secoes 30 e 37).

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets com hash do Vite: cache longo.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA: /login, /invite, /dashboard... voltam para o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
