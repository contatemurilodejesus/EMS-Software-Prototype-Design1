# Mosquitto 2.x - EnergyMatrix (Fase 4 - ingestao MQTT real)
#
# DEV/PILOTO LOCAL: acesso anonimo para facilitar a validacao com o simulador
# de gateways. PRODUCAO: `allow_anonymous false` + `acl_file` credencial por
# gateway (cada credencial so publica em energy/{tenant_do_gateway}/#).
